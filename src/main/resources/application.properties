spring.application.name=email-agent-showcase

# Database - FIXED URL FORMAT
spring.datasource.url=YOUR_DATABASE_URL
spring.datasource.username=YOUR_USER_NAME
spring.datasource.password=YOUR_PASSWORD
spring.datasource.driver-class-name=YOUR_DATABASE_DRIVER

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Email Config
agent.email.address=YOUR_EMAIL@gmail.com
agent.email.password=YOUR_APP_PASSWORD_HERE
agent.email.imap.host=imap.gmail.com
agent.email.imap.port=993

# SMTP
# Example application.properties
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=YOUR_EMAIL@gmail.com
spring.mail.password=YOUR_APP_PASSWORD_HERE
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Groq Config
spring.ai.openai.api-key=YOUR_AI_API-KEY
spring.ai.openai.base-url=YOUR_API-KEY_PROVEDER_URL
spring.ai.openai.chat.options.model=YOUR_zJSN

# View Settings
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# Telegram - USE YOUR HUMAN ID HERE (not the bot id)
telegram.bot.token=YOUR_TELEGRAM_BOT_TOKEN
telegram.chat.id=TOUR_CHAT_ID_OF_TELEGRAM